# Canary dashboard container (installed as /etc/nginx/conf.d/default.conf,
# inside nginx's `http {}` block). Serves the built SPA and reverse-proxies the
# backend, so the browser uses a single origin: http://<pi-ip>/.

# Forward "Connection: upgrade" only when the client asked for a WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Access-log line without the query string: the WebSocket URL carries the
# user's JWT (?token=...), which must not end up in the logs.
log_format canary_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status '
                           '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Putting the upstream in a variable makes nginx
    # re-resolve "backend" (valid=10s) instead of pinning the IP it saw at
    # startup: a recreated backend container keeps working, and nginx starts
    # even while the backend is still down (it answers 502 until it is up).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Shared by every proxied location below. The request URI is passed
    # through unchanged (proxy_pass has no URI part).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Live WebSocket (/api/v1/ws/incidents): long-lived, so no 60 s idle cut.
    location /api/v1/ws/ {
        proxy_pass $backend;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        access_log /var/log/nginx/access.log canary_no_query;
        # Error lines quote the full request (JWT in ?token=) and can't be reformatted;
        # upstream outages still show up in the /api/ and /health logs.
        error_log /var/log/nginx/error.log crit;
    }

    # Incident brief: the AI HAT+ 2 may write for up to a minute (more when it hands over to
    # the template), longer than nginx's default 60 s read timeout.
    location ~ ^/api/v1/incidents/[^/]+/brief$ {
        proxy_pass $backend;
        proxy_read_timeout 120s;
    }

    # Hub software updates: starting "update all" asks every Pi to check the commit, and a Pi
    # may fetch from GitHub first; "Check now" fetches on every Pi.
    location /api/v1/hub/software/ {
        proxy_pass $backend;
        proxy_read_timeout 120s;
    }

    # REST API, health check and the OpenAPI docs.
    location /api/ {
        proxy_pass $backend;
    }
    location = /health {
        proxy_pass $backend;
    }
    location = /openapi.json {
        proxy_pass $backend;
    }
    location /docs {
        proxy_pass $backend;
    }

    # Content-hashed build output never changes: cache it hard.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the SPA: client-side routes (/manager, /dispatch, ...)
    # fall back to index.html, which is always revalidated.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
