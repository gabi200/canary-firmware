# Canary hub: MQTT broker + backend API + web dashboard, sized for a Raspberry
# Pi on 64-bit Raspberry Pi OS (arm64). Every image is multi-arch, so the same
# file also runs on a laptop for development.
#
#   first run    scripts/pi_setup.sh [sensor-user ...]    # .env secrets + MQTT users
#   start        docker compose up -d --build
#   dashboard    http://<pi-ip>/          (also proxies /api, /health, /docs)
#   API          http://<pi-ip>:8000      (REST + WebSocket, e.g. for the mobile app)
#   simulators   docker compose --profile sim run --rm hw-sim --scenario co --fast
#   logs         docker compose logs -f backend mosquitto
#   three Pis    scripts/pi_setup.sh --cluster <vip> <processing-ip> <web-ip> <ai-ip>: adds profile
#                "cluster" (etcd, postgres, pgproxy, keepalived) through .env (RUNME.md section 3)
#
# RUNME.md walks through all of it; docs/HARDWARE.md is the MQTT/API contract.

name: canary

# Bounded json-file logs so a long-running Pi does not fill its SD card.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The simulators log in as the backend's broker user "hub". Three Pis: the broker behind the
# floating IP (CANARY_MQTT_HOST), the one the processing Pi reads, whichever Pi they run on.
x-sim-env: &sim-env
  MQTT_HOST: ${CANARY_MQTT_HOST:-mosquitto}
  MQTT_PORT: "1883"
  MQTT_USERNAME: hub
  MQTT_PASSWORD: ${CANARY_MQTT_PASSWORD:?run scripts/pi_setup.sh first}

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"   # plaintext MQTT for the ESP32 sensors: trusted LAN / IoT VLAN only
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro   # mosquitto.conf + generated passwd
      - mosquitto_data:/mosquitto/data            # retained status/availability survive restarts
    healthcheck:
      # Checks the listening socket. An MQTT probe would need credentials and
      # would log a connect/disconnect pair on every run.
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':1883 '"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      pgproxy:   # three Pis only (profile "cluster"); ignored on one Pi
        condition: service_started
        required: false
    # Secrets written by scripts/pi_setup.sh. Any other backend setting
    # (CANARY_*, docs/HARDWARE.md section 6) can be added to .env as well.
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"   # hailo-ollama on the AI Pi's host (CANARY_LLM_URL)
    environment:
      # SQLite on a named volume. To use Postgres instead, set in .env e.g.
      #   CANARY_DATABASE_URL=postgresql+asyncpg://canary:<password>@<host>:5432/canary
      # (three Pis: scripts/pi_setup.sh --cluster points it at pgproxy, below).
      CANARY_DATABASE_URL: ${CANARY_DATABASE_URL:-sqlite+aiosqlite:////data/canary.db}
      CANARY_MQTT_ENABLED: "true"
      # Three Pis: the floating IP, so every Pi's backend uses the front door's broker.
      CANARY_MQTT_HOST: ${CANARY_MQTT_HOST:-mosquitto}
      CANARY_MQTT_PORT: "1883"
      CANARY_MQTT_USERNAME: hub
      # Required: refuse to start rather than fall back to insecure defaults.
      CANARY_MQTT_PASSWORD: ${CANARY_MQTT_PASSWORD:?run scripts/pi_setup.sh first}
      CANARY_JWT_SECRET: ${CANARY_JWT_SECRET:?run scripts/pi_setup.sh first}
    volumes:
      - backend_data:/data
      - cluster_state:/run/canary:ro   # three Pis: keepalived's VRRP state (vrrp_state)
    ports:
      - "8000:8000"   # REST + WebSocket for the mobile app (the dashboard uses port 80)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${CANARY_HTTP_PORT:-80}:80"   # dashboard; set CANARY_HTTP_PORT in .env if 80 is taken
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # --- Three Pis: profile "cluster", switched on by COMPOSE_PROFILES=cluster in .env ---
  # scripts/pi_setup.sh --cluster writes their settings (RUNME.md section 3). Every Pi runs all
  # four; etcd, postgres and keepalived in the host's network namespace, where they reach the other
  # Pis at their LAN addresses. The empty defaults are deliberate: compose interpolates disabled
  # services too, so `:?` here would break the one-Pi hub. postgres, pgproxy and keepalived check
  # their settings themselves.

  # Patroni's consensus store. Survives one Pi down; with two down there is no quorum and
  # Postgres stops taking writes instead of splitting. Ports 2379 (clients) and 2380 (peers).
  etcd:
    image: quay.io/coreos/etcd:v3.5.34
    profiles: ["cluster"]
    network_mode: host
    restart: unless-stopped
    command:
      - etcd
      - --name=${CANARY_NODE_NAME:-}
      - --data-dir=/var/lib/etcd/data   # etcd creates it with mode 0700
      - --listen-peer-urls=http://${CANARY_NODE_IP:-}:2380
      - --initial-advertise-peer-urls=http://${CANARY_NODE_IP:-}:2380
      - --listen-client-urls=http://${CANARY_NODE_IP:-}:2379,http://127.0.0.1:2379
      - --advertise-client-urls=http://${CANARY_NODE_IP:-}:2379
      - --initial-cluster=processing=http://${CANARY_PROCESSING_IP:-}:2380,web=http://${CANARY_WEB_IP:-}:2380,ai=http://${CANARY_AI_IP:-}:2380
      - --initial-cluster-token=canary
      # Only read while the data directory is empty. A Pi rebuilt with an empty disk joins the
      # running cluster once with CANARY_ETCD_STATE=existing (DEBUG.md section 9).
      - --initial-cluster-state=${CANARY_ETCD_STATE:-new}
      # Slower than etcd's defaults (100 / 1000 ms): SD cards and busy Pis stall for longer.
      - --heartbeat-interval=250
      - --election-timeout=2500
      # Without compaction the key history grows until etcd stops accepting writes.
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=1h
      - --snapshot-count=10000
    volumes:
      - etcd_data:/var/lib/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging

  # PostgreSQL 16 under Patroni (cluster/patroni): one primary, a synchronous standby and a
  # replica; Patroni promotes a replica when the primary's Pi fails. The backend reaches the primary
  # through pgproxy. Ports 5432 (PostgreSQL), 8008 (Patroni REST API).
  postgres:
    build: ./cluster/patroni
    profiles: ["cluster"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      - etcd
    stop_grace_period: 30s   # a clean stop hands the primary role over at once
    environment:
      # Checked by cluster/patroni/entrypoint.sh before Patroni starts.
      CANARY_NODE_NAME: ${CANARY_NODE_NAME:-}
      CANARY_NODE_IP: ${CANARY_NODE_IP:-}
      CANARY_DB_PASSWORD: ${CANARY_DB_PASSWORD:-}   # role "canary" (post_bootstrap)
      # This Pi's part of Patroni's settings; the shared part is cluster/patroni/patroni.yml.
      PATRONI_NAME: ${CANARY_NODE_NAME:-}
      PATRONI_RESTAPI_LISTEN: ${CANARY_NODE_IP:-}:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: ${CANARY_NODE_IP:-}:8008
      PATRONI_RESTAPI_USERNAME: patroni
      PATRONI_RESTAPI_PASSWORD: ${CANARY_PG_SUPERUSER_PASSWORD:-}
      PATRONI_POSTGRESQL_LISTEN: ${CANARY_NODE_IP:-}:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${CANARY_NODE_IP:-}:5432
      PATRONI_ETCD3_HOSTS: "'${CANARY_PROCESSING_IP:-}:2379','${CANARY_WEB_IP:-}:2379','${CANARY_AI_IP:-}:2379'"
      PATRONI_SUPERUSER_PASSWORD: ${CANARY_PG_SUPERUSER_PASSWORD:-}
      PATRONI_REPLICATION_PASSWORD: ${CANARY_PG_REPLICATION_PASSWORD:-}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # Patroni's REST API: 200 while PostgreSQL runs on this Pi (primary or replica).
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://${CANARY_NODE_IP:-127.0.0.1}:8008/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging: *logging

  # The backend's database address (pgproxy:5432 in CANARY_DATABASE_URL). HAProxy asks every Pi's
  # Patroni which one is the primary (every 2 s) and forwards there; after a failover it cuts the
  # sessions to the old primary at once (cluster/haproxy/haproxy.cfg). On the compose network like
  # the backend, not published: the host's port 5432 is this Pi's Postgres.
  pgproxy:
    image: haproxy:3.0.29-alpine
    profiles: ["cluster"]
    restart: unless-stopped
    environment:
      CANARY_PROCESSING_IP: ${CANARY_PROCESSING_IP:-}
      CANARY_WEB_IP: ${CANARY_WEB_IP:-}
      CANARY_AI_IP: ${CANARY_AI_IP:-}
    volumes:
      - ./cluster/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    logging: *logging

  # The floating IP (CANARY_VIP): the sensors' MQTT host and the dashboard/app address. VRRP
  # between the three Pis (IP protocol 112, unicast) keeps it on the best Pi whose dashboard and
  # broker answer: web, else processing, else ai (cluster/keepalived).
  keepalived:
    build: ./cluster/keepalived
    profiles: ["cluster"]
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    environment:
      CANARY_NODE_NAME: ${CANARY_NODE_NAME:-}
      CANARY_NODE_IP: ${CANARY_NODE_IP:-}
      CANARY_PROCESSING_IP: ${CANARY_PROCESSING_IP:-}
      CANARY_WEB_IP: ${CANARY_WEB_IP:-}
      CANARY_AI_IP: ${CANARY_AI_IP:-}
      CANARY_VIP: ${CANARY_VIP:-}
      CANARY_VRRP_PASSWORD: ${CANARY_VRRP_PASSWORD:-}
      CANARY_HTTP_PORT: ${CANARY_HTTP_PORT:-80}
    volumes:
      - cluster_state:/run/canary   # vrrp_state: MASTER | BACKUP | FAULT | STOP, read by the backend
    logging: *logging

  # Announces the hub as canary-hub.local and _canary-hub._tcp (sensors and the app find it by
  # name, whatever subnet the hotspot hands out). One Pi: always. Three Pis: only the Pi holding
  # the floating IP, while its etcd has quorum. Uses the host's avahi-daemon over D-Bus.
  announcer:
    build: ./cluster/announcer
    network_mode: host
    restart: unless-stopped
    environment:
      CANARY_CLUSTER_MODE: ${CANARY_CLUSTER_MODE:-}
      CANARY_NODE_NAME: ${CANARY_NODE_NAME:-}
      CANARY_VIP: ${CANARY_VIP:-}
      CANARY_PROCESSING_IP: ${CANARY_PROCESSING_IP:-}
      CANARY_WEB_IP: ${CANARY_WEB_IP:-}
      CANARY_AI_IP: ${CANARY_AI_IP:-}
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - cluster_state:/run/canary:ro
    logging: *logging

  # --- Simulators: profile "sim", never started by a plain `docker compose up` ---

  # Firmware-accurate ESP32 air + water nodes (status documents of docs/HARDWARE.md).
  #   docker compose --profile sim run --rm hw-sim --scenario co --fast
  hw-sim:
    build: ./simulator
    profiles: ["sim"]
    init: true
    depends_on:
      mosquitto:
        condition: service_healthy
    environment: *sim-env
    command: ["--scenario", "normal"]

  # Many rooms at once (simulator/rooms.demo.json: 14 rooms, 20 hw_sim nodes): creates the
  # missing zones through the hub's admin API and moves every node into its room. Stop hw-sim
  # first (same base topics). Interactive: type e.g. "bucatarie gaz", "toate normal", "list".
  #   docker compose --profile sim run --rm building-sim                  (Ctrl-C stops)
  #   docker compose --profile sim up -d building-sim && docker compose attach building-sim
  #   docker compose --profile sim run --rm building-sim --config rooms.small.json --fast
  building-sim:
    build: ./simulator
    profiles: ["sim"]
    init: true
    stdin_open: true
    tty: true
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_started   # building_sim.py waits for the API itself
    environment:
      <<: *sim-env
      HUB_URL: http://backend:8000
    entrypoint: ["python", "building_sim.py"]
    command: ["--config", "rooms.demo.json"]

  # Legacy canary.telemetry.v1 simulator (sensors of the seeded demo building).
  #   docker compose --profile sim run --rm simulator --scenario gas_leak
  simulator:
    build: ./simulator
    profiles: ["sim"]
    init: true
    depends_on:
      mosquitto:
        condition: service_healthy
    environment: *sim-env
    entrypoint: ["python", "simulate.py"]
    command: ["--scenario", "gas_leak"]

  # Test receiver for the escalation webhook (ARC / 112 partner): checks the HMAC signature
  # and timestamp, logs each event. Point the backend at it with
  # CANARY_ESCALATION_URL=http://arc-sim:8099/canary in .env (RUNME.md section 1.8):
  #   docker compose --profile sim up -d arc-sim && docker compose logs -f arc-sim
  arc-sim:
    build: ./simulator
    profiles: ["sim"]
    init: true
    environment:
      CANARY_ESCALATION_SECRET: ${CANARY_ESCALATION_SECRET:-}
    entrypoint: ["python", "arc_receiver.py"]
    ports:
      - "8099:8099"

volumes:
  mosquitto_data:
  backend_data:
  cluster_state:   # keepalived -> backend (three Pis; stays empty on one Pi)
  etcd_data:
  pg_data:
