# Canary hub MQTT broker (Mosquitto 2.x, image eclipse-mosquitto:2).
#
# The ESP32 air/water sensors connect here with a username + password over
# plaintext MQTT (their firmware has no TLS). Run the hub only on a trusted
# LAN or an isolated IoT VLAN - see RUNME.md "Security notes".
#
# This directory is mounted read-only at /mosquitto/config. The password file
# next to this one (`passwd`) is generated by scripts/pi_setup.sh, is owned by
# the container's mosquitto user (uid 1883, mode 0600) and is never committed.

# One plain MQTT listener on every interface of the container; docker compose
# publishes it on the Pi's port 1883.
listener 1883

# Every client (sensors, backend, simulators) must authenticate.
allow_anonymous false
password_file /mosquitto/config/passwd

# No ACL file on purpose: a mismatched ACL makes the broker silently drop a
# device's publishes. Optional per-device ACL hardening is described in
# RUNME.md ("Optional: per-device ACLs").

# Keep retained status/availability messages across broker restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Log to stdout: read it with `docker compose logs mosquitto`.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true
