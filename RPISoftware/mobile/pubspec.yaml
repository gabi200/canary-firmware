name: canary_resident
description: Canary resident app - emergency alerts, evacuation guidance, and safety check-in.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  # Pinned by flutter_localizations (gen-l10n); also used for locale-aware dates/numbers.
  intl: ^0.20.2
  url_launcher: ^6.3.2
  wakelock_plus: ^1.5.2
  # Remote push. Optional at runtime (see Config.enableFirebasePush); requires
  # Firebase project config to actually deliver. The app runs fully without it
  # via WebSocket (foreground) + local notifications.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  bonsoir: ^7.1.5

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # gen-l10n: lib/l10n/app_*.arb -> lib/l10n/app_localizations*.dart (see l10n.yaml).
  generate: true
  assets:
    - assets/signs/
