# Flutter gen-l10n. Sources: lib/l10n/app_en.arb (template) + app_ro.arb.
# Output (regenerated by `flutter pub get` / `flutter gen-l10n`):
#   lib/l10n/app_localizations.dart (+ _en, _ro)
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
