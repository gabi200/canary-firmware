# Canary three-Pi hub: the backend's way to the PostgreSQL primary (compose service "pgproxy",
# profile "cluster"; RUNME.md section 3). Every Pi runs one; its backend connects to
# pgproxy:5432 (CANARY_DATABASE_URL).
#
# Every 2 s HAProxy asks each Pi's Patroni (REST API, port 8008) GET /primary: only the primary
# answers 200, so connections go there and nowhere else. After a failover the old primary is
# marked down and the sessions still open to it are cut at once (on-marked-down
# shutdown-sessions): the backend's pool reconnects through here to the new primary.
#
# "${CANARY_*_IP}" come from the environment (docker-compose.yml passes them from .env). Without
# them HAProxy would take ":5432" for "wherever the client connected to": refuse to start instead.
.if streq("${CANARY_PROCESSING_IP}","") || streq("${CANARY_WEB_IP}","") || streq("${CANARY_AI_IP}","")
    .alert "CANARY_PROCESSING_IP, CANARY_WEB_IP and CANARY_AI_IP must be set in .env: run scripts/pi_setup.sh on this Pi (RUNME.md section 3)"
.endif

# Server UP / DOWN changes appear in `docker compose logs pgproxy`; connections are not logged.
global
    maxconn 256
    hard-stop-after 3s

defaults
    mode tcp
    timeout connect 3s
    timeout check 2s
    # Pooled database connections sit idle between queries; the backend pings them before use.
    timeout client 30m
    timeout server 30m

listen postgres
    bind :5432
    mode tcp
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server processing "${CANARY_PROCESSING_IP}:5432" check port 8008
    server web "${CANARY_WEB_IP}:5432" check port 8008
    server ai "${CANARY_AI_IP}:5432" check port 8008
